[project]
name = "supplychainops"
version = "1.0.0"
description = "PortOps — container terminal demurrage, dispute claims, and drayage dispatch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supplychainops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
